## Profile Configurations
[params.profile]
  portrait = "/images/portrait.png"
  firstname = "Ruud"
  lastname = "Voorjans"
  title = "Cloud / DevOps Engineer"
  location = "Simpelveld"
  bio = """
  Cloud / DevOps engineer with 10+ years of experience, grown from sysadmin into building and automating cloud platforms. <br>
By day I design and run cloud-native infrastructure on Azure and Kubernetes,
turning manual toil into IaC, CI/CD and GitOps with tools like Terraform, Bicep, Ansible and Argo CD. <br> <br>
By night you will find me "z-shelling" in the terminal: tinkering in my homelab, automating the boring bits and learning the next thing. <br>
Happiest when everything is reproducible, version-controlled and just a <code>git push</code> away. Passionate about open source."""

